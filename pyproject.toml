[project]
  name = "jorge-menjivar"
  version = "0.1.0"
  description = "Add your description here"
  readme = "README.md"
  requires-python = ">=3.13"
  dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "qiskit>=2.5.1",
    "qiskit-aer>=0.17.2",
  ]

[dependency-groups]
  dev = ["ruff>=0.16.0", "ty>=0.0.64"]


# Replaces the previous [tool.pyright] section. Add "tests" to src.include
# once that directory exists.
[tool.ty.environment]
  python-version  = "3.13"
  python-platform = "linux"
  # src/ is the import root: modules there import each other by bare name
  # (`from nn import ...`), so ty needs it on the search path.
  root            = ["./src"]

[tool.ty.src]
  include = ["src"]
  exclude = ["**/__pycache__", "**/node_modules"]

[tool.ty.rules]
  # Defaults to a warning, which would not fail CI. Stale suppressions are how
  # a type checker quietly stops checking things, so treat them as errors.
  unused-type-ignore-comment = "error"

[tool.yapf]
  based_on_style        = "pep8"
  spaces_before_comment = 2
  indent_width          = 4

[tool.ruff]
  # Same as Black.
  line-length = 88
  target-version = "py313"
  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
  ]

  [tool.ruff.format]
    # Enable reformatting of code snippets in docstrings.
    docstring-code-format = true

  [tool.ruff.lint]
    # Enable ruff preview features.
    preview = true
    # Allow unused variables when underscore-prefixed.
    dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
    fixable = [
      "ALL",
    ] # Allow autofix for all enabled rules (when `--fix`) is provided.
    unfixable = []
    # Pycodestyle (`E`)
    # Pyflakes (`F`)
    # Pycodestyle warnings (`W`)
    # Import Sorting (`I`)
    # McCabe complexity (`C901`)
    # Type Checking (`TCH`)
    # Naming Conventions (`N`)
    # Pydocstyle (`D`)
    # Pydoclint (`DOC`)
    # Pyupgrade (`UP`)
    # FastAPI (`FAST`)
    # Async (`ASYNC`)
    select = [
      "E",
      "F",
      "W",
      "I",
      "complex-structure",
      "TCH",
      "N",
      "D",
      "DOC",
      "UP",
      "FAST",
      "ASYNC",
      "RUF",
    ]
    # ruff 0.16 wants rule names rather than codes in selectors, so these were
    # rewritten from N805 / D100-D104.
    ignore = [
      "invalid-first-argument-name-for-method",
      "undocumented-public-module",
      "undocumented-public-class",
      "undocumented-public-method",
      "undocumented-public-function",
      "undocumented-public-package",
    ]
    per-file-ignores = {}

    [tool.ruff.lint.pydoclint]
      # Skip docstrings which fit on a single line.
      ignore-one-line-docstrings = true

    [tool.ruff.lint.pydocstyle]
      convention = "numpy"
